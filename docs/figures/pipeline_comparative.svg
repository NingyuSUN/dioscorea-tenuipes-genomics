<title id="title">Comparative phylogeny · two evidence streams</title>
<desc id="description">Nuclear and chloroplast analyses remain distinct before paired, assumption-aware interpretation. Solid teal arrows denote the configured workflow. Dashed amber arrows denote separate historical scripts or templates. Dotted blue arrows denote research data flow without an automation claim.</desc>
<defs>
