<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1190" viewBox="0 0 1680 1190" role="img" aria-labelledby="title description">
<title id="title">Population genomics · inputs, panels and sensitivity</title>
<desc id="description">Original contig coordinates are retained throughout the configured population workflow. Solid teal arrows denote the configured workflow. Dashed amber arrows denote separate historical scripts or templates. Dotted blue arrows denote research data flow without an automation claim.</desc>
<defs>
