# Overlay enabling the historical assembly/annotation module (scripts 01-15).
# TEMPLATE ONLY: replace every path with real inputs before running.
#   snakemake --configfile config/config.yaml config/assembly.yaml -n assembly_all
assembly:
  outdir: results/assembly
  fast5_dir: raw_fast5
  illumina_r1: reads_R1.fastq.gz
  illumina_r2: reads_R2.fastq.gz
  adapters: TruSeq3-PE-2.fa
  genome_size: 400m
  hypo_coverage: 50
  medaka_model: ""               # empty: medaka default
  busco_lineage: embryophyta_odb10
  repeatmasker_species: arabidopsis
  rnaseq_dir: RNA_Seq            # <sample>_1.fq.gz / <sample>_2.fq.gz
  rnaseq_parallel_samples: 4
  proteins: [Dalata.faa, Dtokoro.fasta, Drotundata.faa]
  braker_species: dioscorea_tenuipes
  quast_reference_fa: ""         # set both to run script 09
  quast_reference_gff: ""
  threads:
    guppy: 30
    flye: 30
    medaka: 30
    trimmomatic: 16
    mapping: 24
    hypo: 24
    busco: 8                     # keep low on machines with ~32 GB RAM
    quast: 30
    repeatmasker: 12
    fastqc: 8
    hisat2: 16
    stringtie: 16
    braker: 32
