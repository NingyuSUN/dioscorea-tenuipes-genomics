# Best-effort pinned environment template derived from the uploaded scripts.
# This is NOT a verified historical reproduction of the original runtime.
# Guppy and NOVOPlasty are excluded because the scripts call them as external tools.
name: dioscorea-pipeline-locked-template
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - perl=5.32
  - openjdk=17
  - pigz=2.8
  - flye=2.9.5
  - medaka=2.1.1
  - minimap2=2.28
  - samtools=1.21
  - bwa=0.7.18
  - hypo=1.0.3
  - fastqc=0.12.1
  - trimmomatic=0.39
  - busco=5.8.3
  - quast=5.2.0
  - repeatmasker=4.1.7
  - rmblast=2.14.1
  - trf=4.09.1
  - hisat2=2.2.1
  - stringtie=2.2.3
  - braker3=3.0.8
  - augustus=3.5.0
  - bcftools=1.21
  - htslib=1.21
  - getorganelle=1.7.7.0
